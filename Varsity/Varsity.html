<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="./images/Maize.png">
    <title>Michigan Overwatch</title>
</head>
<body>
<div class="topnav">
    <a href="../Homepage/Homepage.html">Home</a>
  <a class="active" href="../Varsity/Varsity.html">Varsity</a>
  <a href="../About/About.html">About</a>
</div>

<div class="hero-filters">
  <button class="filter-btn active" data-role="all">All</button>
  <button class="filter-btn" data-role="tank">Tank</button>
  <button class="filter-btn" data-role="damage">Damage</button>
  <button class="filter-btn" data-role="support">Support</button>
</div>  

<div class="hero-container">
    <div class="hero-panel" data-hero="Yimitra" data-role="support">
        <div class="hero-image-wrapper">
            <img src="./images/S_Lucio.png" alt="Lucio" class="hero-image">
        </div>
        <div class="hero-info">
            <span class="hero-name">Yimitra</span>
            <span class="hero-role">Support</span>
        </div>
    </div>

<div class="hero-panel" data-hero="Altraxia" data-role="damage">
    <div class="hero-image-wrapper">
        <img src="./images/S_Sojourn.png" alt="Sojourn" class="hero-image">
    </div>
    <div class="hero-info">
        <span class="hero-name">Altraxia</span>
        <span class="hero-role">Damage</span>
    </div>
</div>

<div class="hero-panel" data-hero="Tobywan" data-role="tank">
        <div class="hero-image-wrapper">
            <img src="./images/S.Doomfist.png" alt="Doomfist" class="hero-image">
        </div>
        <div class="hero-info">
            <span class="hero-name">Tobywan</span>
            <span class="hero-role">Tank</span>
        </div>
</div>

    <div class="hero-panel" data-hero="David" data-role="tank">
        <div class="hero-image-wrapper">
            <img src="./images/S_Reinhardt.png" alt="Reinhardt" class="hero-image">
        </div>
        <div class="hero-info">
            <span class="hero-name">Teashark</span>
            <span class="hero-role">Tank</span>
        </div>
    </div>

<div class="hero-panel" data-hero="Jessica" data-role="support">
    <div class="hero-image-wrapper">
        <img src="./images/S_Kiriko.png" alt="Kiriko" class="hero-image">
    </div>
    <div class="hero-info">
        <span class="hero-name">Pupzy</span>
        <span class="hero-role">Support</span>
    </div>
</div>

<div class="hero-panel" data-hero="Kennybay" data-role="damage">
        <div class="hero-image-wrapper">
            <img src="./images/S_Tracer.png" alt="Tracer" class="hero-image">
        </div>
        <div class="hero-info">
            <span class="hero-name">Kennybay</span>
            <span class="hero-role">Damage</span>
        </div>
</div>

</div>

<script src="js/script.js"></script>
</body>
</html>
